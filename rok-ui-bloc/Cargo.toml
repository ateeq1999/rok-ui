[package]
name = "rok-ui-bloc"
description = "The BLoC primitives behind rok_ui::bloc: blocs, cubits, emitters and concurrency modes, without GPUI."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "README.md"
repository = "https://github.com/ateeq1999/rok-ui"
documentation = "https://docs.rs/rok-ui-bloc"
keywords = ["bloc", "state-management", "architecture", "gpui"]
categories = ["asynchronous", "gui"]

[lints]
workspace = true

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }
trybuild = "1"
