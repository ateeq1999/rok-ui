name: Feature or component request
description: Suggest a new component, prop or API.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to build?
      description: The problem you are solving, not just the API you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: How you would like to write it. For a shadcn/ui component, link its page.
      render: rust
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to open a pull request for this
