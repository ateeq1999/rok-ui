[package]
name = "rok-ui-cli"
description = "cargo rok-ui: create rok-ui apps, generate BLoC features, vendor components and write route trees."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "README.md"
repository = "https://github.com/ateeq1999/rok-ui"
documentation = "https://docs.rs/rok-ui-cli"
keywords = ["gpui", "cli", "scaffold", "components"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[[bin]]
name = "cargo-rok-ui"
path = "src/main.rs"

[dependencies]
rok-ui-build = { version = "0.8.0", path = "../rok-ui-build" }
# The `generate` JSON payload: parsed with serde, described with schemars (already in the
# dependency tree through GPUI), types validated with syn.
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `-j` errors name the JSON path of the bad value.
serde_path_to_error = "0.1"
syn = { version = "3", features = ["full"] }
