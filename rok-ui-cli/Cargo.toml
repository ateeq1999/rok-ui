[package]
name = "rok-ui-cli"
description = "cargo rok-ui: create rok-ui apps, vendor components and write route trees."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "README.md"
repository = "https://github.com/ateeq1999/rok-ui"
documentation = "https://docs.rs/rok-ui-cli"
keywords = ["gpui", "cli", "scaffold", "components"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[[bin]]
name = "cargo-rok-ui"
path = "src/main.rs"

[dependencies]
rok-ui-build = { version = "0.7.0", path = "../rok-ui-build" }
serde_json = "1"
