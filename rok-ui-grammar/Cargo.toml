[package]
name = "rok-ui-grammar"
description = "Parsing and code generation behind rok-ui's macros, as a testable library."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "README.md"
repository = "https://github.com/ateeq1999/rok-ui"
documentation = "https://docs.rs/rok-ui-grammar"
keywords = ["gpui", "macros", "codegen"]
categories = ["development-tools::procedural-macro-helpers"]

[lints]
workspace = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
