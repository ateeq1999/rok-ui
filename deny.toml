# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# CI runs `cargo deny --all-features check` (the "Licenses & advisories" job).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Only flag unmaintained crates that rok-ui depends on directly. GPUI's own tree has several
# (async-std, instant, paste, rustybuzz, ...) that rok-ui cannot replace.
unmaintained = "workspace"
ignore = [
    # ttf-parser is unmaintained. rok-ui reads font coverage with it, and GPUI's text stack
    # (rustybuzz) uses it too, so switching (e.g. to skrifa) only helps once GPUI does.
    { id = "RUSTSEC-2026-0192", reason = "shared with GPUI's text stack; revisit when GPUI moves off ttf-parser" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# rok-ui itself is MIT. These are the licenses of its dependencies (mostly GPUI's tree).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# GPUI pulls in many crates at two versions; duplicates are not actionable here.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
