[workspace]
members = [".", "macros", "rok-ui-build", "examples/file_routes"]
resolver = "2"

[workspace.lints.rust]
# One allowed site: the DirectWrite lookup in `fonts`, in its own module with SAFETY docs.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
too_many_lines = "allow"
# Layout code converts between pixels (f32), indices and counts constantly.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Colors are written as 0xRRGGBB.
unreadable_literal = "allow"
# Builders carry many independent flags (`disabled`, `loading`, ...).
struct_excessive_bools = "allow"
# Explicit per-case tables (key maps, alignments) read better unmerged.
match_same_arms = "allow"
# Callbacks are `Rc`s passed by value and cloned into handlers.
needless_pass_by_value = "allow"

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[package]
name = "rok-ui"
description = "shadcn/ui-style component system for GPUI desktop apps, with a React-like developer experience."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "README.md"
repository = "https://github.com/ateeq1999/rok-ui"
documentation = "https://docs.rs/rok-ui"
keywords = ["gpui", "ui", "desktop", "components", "shadcn"]
categories = ["gui"]
# README links to screenshots on raw.githubusercontent.com, so they stay out of
# the .crate tarball, along with repository tooling.
exclude = [
    "docs/screenshots", ".github", ".agents", ".claude", "scripts", ".gitattributes", ".gitignore",
    "AGENTS.md", "CLAUDE.md", "enhance.md", "roadmap.md", "release-plz.toml", "cliff.toml",
]

[lints]
workspace = true

[dependencies]
gpui = "0.2.2"
rok-ui-macros = { version = "0.5.0", path = "macros" }
unicode-segmentation = { version = "1.12", optional = true }
unicode-bidi = "0.3"
ttf-parser = "0.25"
jiff = { version = "0.2", optional = true }
rok-ui-hooks = { version = "0.3", optional = true }
rok-db = { version = "0.1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }
futures = { version = "0.3", optional = true }
garde = { version = "0.23", optional = true }

# Reads which Arabic letter forms installed fonts have (the same crate GPUI uses).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_DirectWrite"] }

# Every component is a feature, so you compile only what you use:
#
#     rok-ui = { version = "0.5", default-features = false, features = ["button", "dialog", "select"] }
#
# Features pull in the components they are built from (`combobox` enables
# `command` and `input`). shadcn/ui names work as aliases (`dropdown-menu`,
# `drawer`, `textarea`, `kbd`), and `forms`, `overlays`, `layout`, `data` and
# `chat` enable a whole group. `full` (the default) enables everything.
# AppRoot, Direction, the theme, icons, hooks and the `styles!` / `view!`
# macros are always available.
[features]
default = ["full"]
full = ["forms", "overlays", "layout", "data", "chat", "shell", "state"]

# Groups.
forms = [
    "form", "button", "calendar", "checkbox", "combobox", "date-picker", "field", "input",
    "input-group", "input-otp", "label", "radio-group", "select", "slider", "switch", "toggle",
]
overlays = [
    "alert-dialog", "command", "dialog", "hover-card", "menu", "menubar", "popover", "sheet",
    "toast", "tooltip",
]
layout = [
    "accordion", "aspect-ratio", "breadcrumb", "button-group", "card", "carousel", "collapsible",
    "empty", "item", "layout-widgets", "pagination", "resizable", "scroll-area", "separator",
    "sidebar", "tabs",
]
data = [
    "alert", "avatar", "badge", "chart", "data-table", "keyboard-shortcut", "progress",
    "skeleton", "spinner", "table", "typography",
]
chat = ["attachment", "bubble", "marker", "message", "message-scroller", "questionnaire"]
shell = ["layout-widgets", "navigation", "scaffold"]

# Bundled Google Fonts (not part of `full`: each adds its font files to your binary).
fonts = ["font-cairo", "font-inter", "font-noto-sans-arabic"]
font-cairo = []
font-inter = []
font-noto-sans-arabic = []

# App infrastructure.
# Reactive state from rok-ui-hooks (signals, memos, effects, stores), wired into GPUI.
state = ["dep:rok-ui-hooks"]
# Queries, mutations, procedures, Suspense (`rok_ui::query`), on the shared runtime.
query = ["runtime", "dep:futures"]
# Headless, type-safe forms (`rok_ui::form`) with bound fields. Part of the `forms` group.
form = ["button", "checkbox", "field", "input", "spinner", "switch"]
# Form validation with garde: `FormValidators::schema(GardeSchema)`.
form-garde = ["form", "dep:garde"]
# The shared tokio runtime for background work (`rok_ui::runtime`).
runtime = ["dep:tokio"]
# Routes with params, back / forward history and links (not part of `full`).
router = []
# PostgreSQL through rok-db, on a background tokio runtime (not part of `full`).
db = ["dep:rok-db", "query"]
# rok-db column types and migrations.
db-chrono = ["db", "rok-db/chrono"]
db-uuid = ["db", "rok-db/uuid"]
db-json = ["db", "rok-db/json"]
db-migrate = ["db", "rok-db/migrate"]

# Components, with the components they are built from.
accordion = []
alert = []
alert-dialog = ["button"]
aspect-ratio = []
attachment = ["button", "spinner"]
avatar = []
badge = []
breadcrumb = ["menu"]
bubble = []
button = ["spinner", "tooltip"]
button-group = []
calendar = ["button", "dep:jiff"]
card = []
carousel = ["button"]
chart = []
checkbox = []
collapsible = []
combobox = ["command", "input"]
command = ["input"]
data-table = ["button", "checkbox", "input", "menu"]
date-picker = ["button", "calendar"]
dialog = ["button"]
empty = []
field = []
hover-card = []
input = ["dep:unicode-segmentation"]
input-group = ["input"]
input-otp = []
item = []
keyboard-shortcut = []
label = []
layout-widgets = []
marker = ["spinner"]
menu = []
menubar = ["menu"]
message = ["bubble"]
message-scroller = ["button"]
navigation = ["tooltip"]
pagination = ["button"]
popover = []
progress = []
questionnaire = ["button", "input", "progress"]
radio-group = []
resizable = []
scaffold = ["button", "layout-widgets", "navigation", "tooltip"]
scroll-area = []
select = ["menu"]
separator = []
sheet = ["button"]
sidebar = ["button", "tooltip"]
skeleton = []
slider = []
spinner = []
switch = []
table = []
tabs = []
toast = ["button", "spinner"]
toggle = ["tooltip"]
tooltip = []
typography = []

# shadcn/ui names for components that live in a shared module.
context-menu = ["menu"]
drawer = ["sheet"]
dropdown-menu = ["menu"]
kbd = ["keyboard-shortcut"]
native-select = ["select"]
navigation-menu = ["menubar"]
textarea = ["input"]
toggle-group = ["toggle"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "gallery"
required-features = ["full"]

[[example]]
name = "counter"
required-features = ["button", "card"]

[[example]]
name = "arabic"
required-features = ["full", "font-cairo"]

[[example]]
name = "arabic_chat"
required-features = ["full", "font-cairo"]

[[example]]
name = "app_shell"
required-features = ["full"]

[[example]]
name = "notes"
required-features = ["full", "router"]

[[example]]
name = "sign_up"
required-features = ["full"]

[[example]]
name = "db_users"
required-features = ["full", "db"]

[[test]]
name = "components"
required-features = ["full"]

[[test]]
name = "sx"
required-features = ["full"]

[[test]]
name = "motion"
required-features = ["full"]

[[test]]
name = "query"
required-features = ["full", "query"]

[[test]]
name = "router"
required-features = ["full", "router"]

[[test]]
name = "form"
required-features = ["full"]

[[test]]
name = "compile_errors"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
env_logger = "0.11"
trybuild = "1"
garde = { version = "0.23", features = ["derive"] }
