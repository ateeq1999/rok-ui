[package]
name = "rok-ui-macros"
description = "Procedural macros for rok-ui: #[component], styles!, keyframes!, children! and view!."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "README.md"
repository = "https://github.com/ateeq1999/rok-ui"
documentation = "https://docs.rs/rok-ui-macros"
keywords = ["gpui", "macros", "component", "ui", "attributes"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[lints]
workspace = true

[dev-dependencies]
# The documentation examples use the macros through rok-ui.
rok-ui = { path = "..", features = ["query"] }

# The documentation examples are doctests, which cargo-udeps cannot see.
[package.metadata.cargo-udeps.ignore]
development = ["rok-ui"]

[dependencies]
proc-macro2 = "1"
rok-ui-grammar = { version = "0.6.0", path = "../rok-ui-grammar" }
syn = { version = "3", features = ["full"] }
