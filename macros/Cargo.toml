[package]
name = "rok-ui-macros"
description = "Procedural macros for rok-ui: #[component], styles!, keyframes!, children! and view!."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "README.md"
repository = "https://github.com/ateeq1999/rok-ui"
documentation = "https://docs.rs/rok-ui-macros"
keywords = ["gpui", "macros", "component", "ui", "attributes"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
