[package]
name = "rok-ui-example-file-routes"
description = "File-based routes with rok-ui: layouts, typed links, guards and queries."
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rok-ui = { path = "../..", features = ["router", "query"] }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

[build-dependencies]
rok-ui-build = { path = "../../rok-ui-build" }
